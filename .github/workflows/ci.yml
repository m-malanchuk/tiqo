name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing version tag to rebuild and release, for example v0.1.0"
        required: false
        type: string

permissions:
  contents: read

env:
  UV_CACHE_DIR: /tmp/tiqo-uv-cache
  UV_PROJECT_ENVIRONMENT: /tmp/tiqo-venv
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install native Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libdbus-1-3 libegl1 libgl1 libxkbcommon0

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest

      - name: Pyright
        run: uv run pyright

  build_python:
    name: Build Python distributions
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.0"
          enable-cache: true

      - name: Build wheel and source distribution
        run: uv build

      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: tiqo-python-${{ github.sha }}
          path: dist/
          if-no-files-found: error

  build_arch:
    name: Build Arch package
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Build in Arch Linux container
        env:
          GITHUB_REF_NAME: ${{ inputs.release_tag || github.ref_name }}
          GITHUB_REF_TYPE: ${{ inputs.release_tag && 'tag' || github.ref_type }}
        run: |
          docker run --rm \
            --env GITHUB_REF_NAME \
            --env GITHUB_REF_TYPE \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            archlinux:base-devel \
            bash -euc '
              pacman -Syu --noconfirm --needed \
                git python pyside6 python-build python-hatchling python-installer
              git config --global --add safe.directory /workspace

              version="${GITHUB_REF_NAME#v}"
              if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
                version="0.1.0"
              fi
              if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                echo "Tag must use vMAJOR.MINOR.PATCH, got: $GITHUB_REF_NAME" >&2
                exit 1
              fi

              build_dir=/tmp/tiqo-package
              rm -rf "$build_dir"
              mkdir -p "$build_dir"
              cp /workspace/packaging/PKGBUILD "$build_dir/PKGBUILD"
              sed -i "s/^pkgver=.*/pkgver=${version}/" "$build_dir/PKGBUILD"
              git -C /workspace archive \
                --format=tar.gz \
                --prefix="tiqo-${version}/" \
                --output="$build_dir/tiqo-${version}.tar.gz" \
                HEAD

              useradd --create-home builder
              chown -R builder:builder "$build_dir"
              runuser -u builder -- bash -euc \
                "cd ${build_dir}; pwd; ls -la; test -f PKGBUILD; makepkg --clean --force --nodeps --noconfirm"

              mkdir -p /workspace/ci-artifacts
              cp "$build_dir"/*.pkg.tar.zst /workspace/ci-artifacts/
            '

      - name: Upload Arch package
        uses: actions/upload-artifact@v4
        with:
          name: tiqo-arch-${{ github.sha }}
          path: ci-artifacts/
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v'))
    needs: [build_python, build_arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tiqo-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            release-assets/* \
            --title "tiqo $RELEASE_TAG" \
            --generate-notes
