stages:
  - quality
  - build
  - release

workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH'

variables:
  UV_CACHE_DIR: "/tmp/tiqo-uv-cache"
  UV_PROJECT_ENVIRONMENT: "/tmp/tiqo-venv"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

quality:
  stage: quality
  image: python:3.12-bookworm
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends libgl1 libegl1 libdbus-1-3 libxkbcommon0 nodejs
    - python -m pip install --no-cache-dir uv
    - uv sync --frozen
  script:
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run pytest
    - uv run pyright

build_python:
  stage: build
  image: python:3.12-bookworm
  before_script:
    - python -m pip install --no-cache-dir uv
  script:
    - uv build
  artifacts:
    name: "tiqo-python-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/
    expire_in: 30 days

build_arch:
  stage: build
  image: archlinux:base-devel
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    - pacman -Syu --noconfirm --needed git python pyside6 python-build python-hatchling python-installer
    - |
      version="${CI_COMMIT_TAG#v}"
      if [[ -z "$CI_COMMIT_TAG" ]]; then
        version="0.1.0"
      fi
      if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
        echo "Tag must use vMAJOR.MINOR.PATCH, got: $CI_COMMIT_TAG" >&2
        exit 1
      fi
      sed -i "s/^pkgver=.*/pkgver=${version}/" packaging/PKGBUILD
      git archive \
        --format=tar.gz \
        --prefix="tiqo-${version}/" \
        --output="packaging/tiqo-${version}.tar.gz" \
        "$CI_COMMIT_SHA"
    - useradd --create-home builder
    - chown -R builder:builder "$CI_PROJECT_DIR"
    - runuser -u builder -- bash -c "cd '$CI_PROJECT_DIR/packaging' && makepkg --clean --force --nodeps --noconfirm -p PKGBUILD"
    - mkdir -p ci-artifacts
    - cp packaging/*.pkg.tar.zst ci-artifacts/
  artifacts:
    name: "tiqo-arch-$CI_COMMIT_SHORT_SHA"
    paths:
      - ci-artifacts/
    expire_in: 30 days

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build_python
      artifacts: true
    - job: build_arch
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "Creating GitLab release for $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "tiqo $CI_COMMIT_TAG"
    description: "Automated release for $CI_COMMIT_TAG"
    assets:
      links:
        - name: "Python distributions"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/download?job=build_python"
          link_type: package
        - name: "Arch package"
          url: "$CI_PROJECT_URL/-/jobs/artifacts/$CI_COMMIT_TAG/download?job=build_arch"
          link_type: package
